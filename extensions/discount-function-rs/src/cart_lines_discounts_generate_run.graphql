query CartInput {
  cart {
    lines {
      id
      quantity
      cost {
        subtotalAmount {
          amount
        }
        totalAmount {
          amount
        }
      }
    }
  }

  discount {
    discountClasses
    discountObject: metafield(namespace: "discount", key: "discountObject") {
      jsonValue
      value
    }
  }
}
